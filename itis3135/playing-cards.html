
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffany Ledbetter's Thriving Ladybug | ITIS3135 | Playing Cards</title>

    <link rel="icon" type="image/png" href="images/favicon-ladybug.png">

<body>

    <!-- Shared site header -->
    <div data-include="components/header.html"></div>

    <main>
        <h2>Playing Cards</h2>

        <figure>
            <img src="images/abstract-circle.png"
                 alt="Purple futuristic digital circle with glowing orbital rings"
                 width="300">
            <figcaption>Creative Technology and Digital Design</figcaption>
        </figure>

        <p>Here are three playing cards created using HTML and CSS.</p>

        <!-- The div elements are used to organize the playing cards.
     The ID and classes are used to style and position the cards with CSS. -->
     <div id="playing-cards">

            <div class="card">
                <div class="left">A ♠</div>
                <div class="middle">♠</div>
                <div class="right">A ♠</div>
            </div>

            <div class="card">
                <div class="left">K ♥</div>
                <div class="middle">♥</div>
                <div class="right">K ♥</div>
            </div>

            <div class="card">
                <div class="left">Q ♦</div>
                <div class="middle">♦</div>
                <div class="right">Q ♦</div>
            </div>

        </div>

    </main>

    <!-- Shared site footer -->
    <div data-include="components/footer.html"></div>
