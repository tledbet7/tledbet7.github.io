
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffany Ledbetter's Thriving Ladybug | ITIS3135 | Inventory</title>

    <link rel="icon" type="image/png" href="images/favicon-ladybug.png">
    <link rel="stylesheet" href="styles/default.css">

    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Shared site header -->
    <div data-include="components/header.html"></div>

    <main>
        <h2>Inventory</h2>

        <figure>
            <img src="images/abstract-circle.png"
                 alt="Purple futuristic digital circle with glowing orbital rings"
                 width="300">
            <figcaption>Creative Technology and Digital Design</figcaption>
        </figure>

        <p>
            This page displays a simple inventory table with different
            products, their quantities, and prices.
        </p>

        <table>
            <caption>Product Inventory</caption>

            <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Notebook</td>
                    <td>15</td>
                    <td>$5.00</td>
                </tr>

                <tr>
                    <td>Pencils</td>
                    <td>30</td>
                    <td>$2.00</td>
                </tr>

                <tr>
                    <td>Folders</td>
                    <td>20</td>
                    <td>$3.00</td>
                </tr>

                <tr>
                    <td>Highlighters</td>
                    <td>12</td>
                    <td>$4.00</td>
                </tr>
            </tbody>
        </table>

    </main>

    <!-- Shared site footer -->
    <div data-include="components/footer.html"></div>

    <script src="scripts/include.min.js"></script>

</body>

</html>
